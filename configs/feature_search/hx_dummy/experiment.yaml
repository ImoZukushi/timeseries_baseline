# 熱交換器ダミーデータの特徴量の探索（configs/feature_search/hx_dummy.yaml）で、全パターンに共通の実験設定。
# データ・CV・指標・LightGBM の設定は configs/experiments/common/ から継承する。
# data.feature_cols は探索の設定のパターンごとに決まる（共通設定の drop_cols は使われない）。
base: [../../experiments/common/hx_dummy.yaml, ../../experiments/common/lgbm.yaml]
# 共通設定の features（薬剤種類のエンコーディング）は、探索ではグループ chemical_type の
# ステップとして入れる（薬剤種類を使わないパターンで、無い列をエンコードしないように）
features: []
# 探索を速く回すため SHAP・誤差評価は無効にする（有望なパターンだけ overrides で有効にする）
explain: {enabled: false}
evaluation: {enabled: false}
