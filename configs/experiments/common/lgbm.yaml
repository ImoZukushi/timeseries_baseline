# 熱交換器ダミーデータで使う LightGBM の設定（探索しない場合の既定のパラメータ）。
# 実験・特徴量の探索の設定から base で継承する。
model:
  name: lightgbm
  params:
    n_estimators: 3000
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
  early_stopping_rounds: 100   # 検証 fold で打ち切るため、スコアはわずかに楽観的
