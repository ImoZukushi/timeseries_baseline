# 特徴量の探索の共通設定（ベースライン）。fe_*.yaml はこのファイルを base にして差分だけを書く。
# 目的変数 `合計` は仮置き。`フェンダー部分(東京方向)` / `台車部分` / `フェンダー部分(金沢方向)` は
# `合計` の内訳でありリークになるため除外している。
#
# 実行: uv run python scripts/run_experiment.py --config "configs/experiments/fe_*.yaml"
# 比較: MLflow の実験 feature_search で cv_mean_rmse を並べる
#       （uv run mlflow ui --backend-store-uri sqlite:///mlruns/mlflow.db）
name: fe_base
task: regression
data:
  train_path: data/processed/train_with_departure_time.csv
  target: 合計
  group_col: 年月日  # 同じ日のデータがtrain/validに跨らないようにする
  drop_cols: [年月日, 発車時刻, フェンダー部分(東京方向), 台車部分, フェンダー部分(金沢方向)]
features:
  - use: categorical_ordinal
# 全パターンで同じCV分割（cv・seed を変えない）を使うので、スコアの差は特徴量の差になる
cv: {method: group, n_splits: 5, seed: 42}
model:
  name: lightgbm
  params: {n_estimators: 2000, learning_rate: 0.05}
  early_stopping_rounds: 100
metrics: [rmse, mae]
# 探索中は速さを優先して SHAP・誤差評価を省く（有望なパターンだけ後で有効にする）
explain: {enabled: false}
evaluation: {enabled: false}
tracking: {experiment_name: feature_search}
